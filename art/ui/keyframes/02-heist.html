<!doctype html>
<!-- Key frame 02, heist (§21.8): the crew at the Vault, under the heist
     screen's interface in the game's words. The law banner top left, clock
     and alarm top centre, loot top right; crew bottom left; Sage, Cast and
     Get out bottom right: eight things to tap. The hand stands on a
     tray of dark glass, so the portraits and buttons keep their value step
     off the bright world. ?lang=pt_BR, ?text=200 and
     ?hc=1 give its other forms; shoot_keyframes.mjs photographs them all. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Key frame 02 · Heist</title>
<link rel="stylesheet" href="../board/tokens.css">
<link rel="stylesheet" href="kit.css">
<style>
body { background-image: url("bg/heist.jpg"); }
html.hc body { background-image: url("bg/heist_hc.jpg"); }
</style>
</head>
<body>
<div class="screen heist">
  <div class="heist-top hud">
    <div class="laws info">
      <span class="laws-here" data-key="HUD_LAWS_HERE" data-check></span>
      <span class="law-chip leather"><img class="ico" src="../../../client/ui/icons/png/laws/sleepwalk.png" alt=""><span class="law-name" data-key="LAW_SLEEPWALK" data-check></span></span>
      <span class="law-chip leather"><img class="ico" src="../../../client/ui/icons/png/laws/glass.png" alt=""><span class="law-name" data-key="LAW_GLASS" data-check></span></span>
    </div>
    <div class="centre">
      <div class="clock parchment info"><span class="display-s clock-figures" data-num="s:2:38" data-check></span></div>
      <div class="alarm leather info" data-label="HUD_ALARM" data-args="s:1 / 6">
        <span class="row"><span class="caption alarm-name" data-key="HUD_ALARM_WORD" data-check></span><span class="number" data-num="s:1 / 6" data-check></span></span>
        <span class="bells"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></span>
      </div>
    </div>
    <div class="loot leather info">
      <span class="loot-row"><span class="caption loot-name" data-key="HUD_ROOM" data-check></span><span class="number" data-num="n:1840" data-check></span></span>
      <span class="loot-row"><span class="caption loot-name" data-key="HUD_LEFT" data-check></span><span class="number"><span>~</span><span data-num="n:2600" data-check></span></span></span>
      <span class="bar" style="--fill: var(--c-starlight); --v: 41%"><i></i><b style="--at: 80%"></b></span>
      <span class="loot-row"><img class="ico" src="../../../client/ui/icons/png/heiststatus/vaultprogress.png" alt=""><span class="bar" style="--fill: var(--c-warn); --v: 64%"><i></i></span></span>
      <span class="caption loot-name" data-key="HUD_LOAD_TO" data-args="d:80" data-check></span>
    </div>
  </div>
  <div class="heist-bottom hud">
    <div class="glass hint info"><span class="caption" data-key="HEIST_HINT_SHORT" data-check></span></div>
    <div class="hand glass tray">
      <div class="crew">
        <div class="mate ctl chosen" data-label="RULEBORN_SKYSKIPPER"><span class="face"><span class="portrait s-motion"><img src="art/skyskipper.png" alt=""></span></span><span class="pips" data-label="HEIST_USES_LEFT" data-args="d:1"><span class="pip"></span><span class="pip spent"></span><span class="number" data-num="d:1" data-check></span></span></div>
        <div class="mate ctl" data-label="RULEBORN_TIDEWALKER"><span class="face"><span class="portrait s-time"><img src="art/tidewalker.png" alt=""></span></span><span class="pips" data-label="HEIST_USES_LEFT" data-args="d:2"><span class="pip"></span><span class="pip"></span><span class="number" data-num="d:2" data-check></span></span></div>
        <div class="mate ctl" data-label="RULEBORN_MOSSBEAR"><span class="face"><span class="portrait s-life"><img src="art/mossbear.png" alt=""></span></span><span class="pips" data-label="HEIST_USES_LEFT" data-args="d:2"><span class="pip"></span><span class="pip"></span><span class="number" data-num="d:2" data-check></span></span></div>
        <div class="mate ctl" data-label="RULEBORN_ECHOPLATE"><span class="face"><span class="portrait s-spirit"><img src="art/echoplate.png" alt=""></span></span><span class="pips" data-label="HEIST_USES_LEFT" data-args="d:0"><span class="pip spent"></span><span class="pip spent"></span><span class="number" data-num="d:0" data-check></span></span></div>
        <div class="mate ctl" data-label="RULEBORN_EMBERLING"><span class="face"><span class="portrait s-energy"><img src="art/emberling.png" alt=""></span></span><span class="pips" data-label="HEIST_USES_LEFT" data-args="d:1"><span class="pip"></span><span class="pip spent"></span><span class="number" data-num="d:1" data-check></span></span></div>
        <span class="plate chosen-name" data-key="RULEBORN_SKYSKIPPER" data-check></span>
      </div>
      <div class="acts">
        <div class="sage ctl" data-label="HEIST_SAGE_COOLING" data-args="k:SAGE_THE_ARCHIVIST|d:12"><span class="seat"><span class="ring gold-round face"><span class="portrait s-time"><img src="art/archivist.png" alt=""></span></span><span class="dial" style="--v: 60%"><span data-num="d:12" data-check></span></span></span><span class="plate" data-key="HEIST_SAGE" data-check></span></div>
        <button class="cast gold ctl" type="button" data-label="HEIST_CAST"><img class="ico" src="../../../client/ui/icons/png/heistcontrols/cast.png" alt=""><span class="button-type" data-key="HEIST_CAST" data-check></span></button>
        <button class="getout alarm-fill ctl" type="button" data-label="HEIST_GET_OUT"><img class="ico" src="../../../client/ui/icons/png/heistcontrols/getout.png" alt=""><span class="button-type" data-key="HEIST_GET_OUT" data-check></span></button>
      </div>
    </div>
  </div>
</div>
<script src="words.js"></script>
<script src="kit.js"></script>
</body>
</html>
