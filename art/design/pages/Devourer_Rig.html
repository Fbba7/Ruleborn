// in-game behaviour: walk to the Star Well, work, carry loot home, rest, run back
const ROUTE=RT||[{to:[.62,1.72],clip:'walk',sp:.42},{at:true,clip:'work',dur:3.2,face:[1.4,2.3]},{to:[-1.2,-.45],clip:'carry',sp:.34},{at:true,clip:'celebrate',dur:1.8},{at:true,clip:'idle2',dur:3,face:[0,2]},{to:[.3,.5],clip:'run',sp:1.05},{at:true,clip:'idle',dur:2.2,face:[3,4]}];
let gs={i:0,t:0,x:.3,z:.5,ry:0,ts:0};
function gameTick(r,t){const dt=Math.min(.05,t-(gs.last||t));gs.last=t;const st2=ROUTE[gs.i];gs.t+=dt;let clip=st2.clip;
 if(st2.to){const dx=st2.to[0]-gs.x,dz=st2.to[1]-gs.z,d=Math.hypot(dx,dz);if(d<.04){gs.i=(gs.i+1)%ROUTE.length;gs.t=0;}else{const s=Math.min(d,st2.sp*dt);gs.x+=dx/d*s;gs.z+=dz/d*s;const want=Math.atan2(dx,dz);let da=want-gs.ry;da=Math.atan2(Math.sin(da),Math.cos(da));gs.ry+=da*Math.min(1,dt*5);}}
 else{if(st2.face){const want=Math.atan2(st2.face[0]-gs.x,st2.face[1]-gs.z);let da=want-gs.ry;da=Math.atan2(Math.sin(da),Math.cos(da));gs.ry+=da*Math.min(1,dt*5);}if(gs.t>=st2.dur){gs.i=(gs.i+1)%ROUTE.length;gs.t=0;}}
 r.mover.position.set(gs.x,0,gs.z);r.mover.rotation.y=gs.ry;const q=CLIPS[clip].f(gs.t);q.x=0;q.z=0;q.ry=clip==='celebrate'?q.ry:0;r.play(q,clip+gs.i);}
let shown=false,fr=0;(function loop(){if(!loop.__k){loop.__k=setInterval(()=>{if(shown){clearInterval(loop.__k);return;}if(rigs.length&&(document.hidden||!VIS))loop(1);},600);}if(arguments[0]!==1)requestAnimationFrame(loop);if((!VIS||document.hidden)&&shown)return;const t=clock.getElapsedTime();
 for(const r of rigs){if(SHEET==='turn'){r.set({x:r.base.x,ry:r.base.ry,sq:(Math.sin(t*3)*.5+.5)*.012});}
  else if(SHEET==='expr'){const b=Math.sin(t*3+r.base.x*4)*.5+.5;r.set({...r.expr,x:r.base.x,ry:r.base.ry,sq:b*.014,hz:(r.expr.hz||0)+Math.sin(t*1.2+r.base.x)*.03});}
  else if(SHEET==='forms'){const ft=r.ghost?Math.max(0,t-.3):t;const q=CLIPS.idle.f(ft+r.base.x*2);q.x=r.base.x+(q.x||0)-(r.ghost?.21:0);q.z=(q.z||0)-(r.ghost?.34:0);q.ry=r.base.ry;r.set(q);}
  else if(r.game){gameTick(r,t);}
  else{const c=CLIPS[CLIP];const ft=r.ghost?Math.max(0,t-t0-.3):t-t0;const q=c.f(ft);if(r.ghost){q.z=(q.z||0)-.22;q.x=(q.x||0)-.2;}r.play(q,CLIP);}}
 for(const r of rigs)if(r.embers)r.embers.forEach((s,i)=>{const k=.8+Math.sin(t*9+i*2)*.2+Math.sin(t*23+i)*.1;s.scale.setScalar(.09*k);s.material.opacity=k;});
 renderer.render(scene,cam);if(!shown&&rigs.length){shown=true;(renderer.domElement.style.opacity='1');}
 if(SIL&&rigs.length&&(fr++%12===0)){try{const c=parent.document.querySelector('canvas[data-sil32]');if(c){const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.drawImage(renderer.domElement,0,0,c.width,c.height);}}catch(e){}}})();
</script></body></html>
