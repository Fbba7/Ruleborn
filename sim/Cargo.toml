[package]
name = "ruleborn-sim"
version = "0.1.0"
edition = "2021"
description = "The heist simulation, written once and compiled for every target it runs on (24.7)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
# The same arithmetic on every target is the whole point, so nothing here may
# license the compiler to reassociate or approximate. Rust never enables
# fast-math, and there is no floating point in the crate to reassociate; these
# settings keep the build reproducible rather than fast.
opt-level = 2
lto = false
codegen-units = 1
panic = "abort"
overflow-checks = true
